# Default values for the OpenKCM Registry chart.
#
# The Registry is the global registry of tenants and systems. It exposes a gRPC API
# (port 9092) and a status server (port 8888), stores its data in PostgreSQL, and sends
# tenant jobs to the CMK of each region over an AMQP broker (Orbital).
#
# Layout of this file:
#   1. Names and labels
#   2. Workload: replicas, image, pod and container settings, probes, resources
#   3. Networking: service, ports, network policy
#   4. Extension points: extra containers, volumes and environment variables
#   5. config: the Registry's own configuration, rendered into /etc/registry/config.yaml
#
# Full reference of the Registry configuration:
#   https://openkcm.io/components/cmk/security/registry-config
#
# Comments starting with "# --" document a value (helm-docs format).

###############################################################################
# 1. Names and labels
###############################################################################

# -- Override the chart name. Used in resource names and in the
# `app.kubernetes.io/name` label.
nameOverride: ""

# -- Override the full name of all resources. Default: `<release name>-registry`,
# or the release name if it already contains `registry`.
fullnameOverride: ""

# -- Namespace for all resources. Empty: the namespace of the Helm release.
# Useful when the chart is installed as a dependency of another chart.
namespace: ""

# -- Labels added to every resource of the chart, for example a team or cost center.
commonLabels: {}

###############################################################################
# 2. Workload
###############################################################################

# -- Number of Registry pods. Ignored when `hpa.enabled` is true. Use two or more
# in production; replicas share the database and need no coordination.
replicaCount: 1

# -- Number of old ReplicaSets kept for `kubectl rollout undo`.
revisionHistoryLimit: 10

# -- Deployment update strategy. Empty uses the Kubernetes default
# (RollingUpdate with 25% maxSurge and 25% maxUnavailable).
# Example:
#   strategy:
#     type: RollingUpdate
#     rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
strategy: {}

image:
  # -- Container registry of the image. Set to "" when `repository` contains the
  # full image name.
  registry: ghcr.io/openkcm

  # -- Image repository within `image.registry`. Release images are published as
  # `ghcr.io/openkcm/registry/images/registry`.
  repository: registry/images/registry

  # -- Image tag, for example `v1.9.0`. Empty: the chart's appVersion, the Registry
  # release this chart deploys by default.
  tag: ""

  # -- Image digest, for example `sha256:0e07…`. Takes precedence over `image.tag`.
  # Use a digest for reproducible deployments.
  digest: ""

  # -- Kubernetes image pull policy: `IfNotPresent`, `Always` or `Never`.
  pullPolicy: IfNotPresent

  # -- Override the container command, as a list or a single string. Empty uses
  # the image's command (`/registry`). The Registry takes no command-line flags;
  # it is configured through `config`.
  command: []

  # -- Arguments passed to the container command.
  args: []

# -- Secrets with credentials for pulling the image from a private registry.
# Example: `[{ name: registry-access }]`
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for the Registry. If false, `serviceAccount.name`
  # (or `default`) must exist.
  create: true
  # -- Mount the ServiceAccount token. The Registry does not call the Kubernetes
  # API; the pod never mounts the token, whatever this value is.
  automount: false
  # -- Annotations for the ServiceAccount, for example for workload identity.
  annotations: {}
  # -- Name of the ServiceAccount. Empty with `create: true`: the chart's full name.
  name: ""

pod:
  # -- Annotations for the pods, for example for a service mesh
  # (`linkerd.io/inject: enabled`). The chart always adds `checksum/config`, which
  # restarts the pods when the configuration changes.
  annotations: {}

  # -- Additional labels for the pods.
  labels: {}

  # -- Pod security context. The defaults run the Registry as user and group 65532
  # (`nonroot` of the distroless release image), give that group access to the
  # mounted volumes (`fsGroup`) and use the runtime's default seccomp profile.
  # `runAsUser` is needed with `runAsNonRoot`: the kubelet refuses to start an image
  # whose user is a name, such as `USER nonroot`, because it cannot check that the
  # user is not root.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # -- Inject environment variables for the Services of the namespace
  # (`<SERVICE>_PORT`, …). Keep this off: the Registry reads environment variables
  # without prefix as configuration overrides, so a Service named `database` would
  # override `config.database.port`.
  enableServiceLinks: false

  # -- PriorityClass of the pods. Empty: the cluster default.
  priorityClassName: ""

  # -- Seconds the pod has to shut down after SIGTERM. Null: the Kubernetes
  # default (30). The Registry stops accepting calls and finishes running ones.
  terminationGracePeriodSeconds: null

  disruptionBudget:
    # -- Create a PodDisruptionBudget, which limits how many pods voluntary
    # disruptions such as node drains may take down at once.
    enabled: false
    # -- Minimum number (for example `1`) or percentage (for example `50%`) of pods
    # that must stay available. Do not set together with `maxUnavailable`. With a
    # single replica, `minAvailable: 1` blocks node drains.
    # minAvailable: 1
    # -- Maximum number or percentage of pods that may be unavailable. Default
    # when neither value is set: `1`.
    # maxUnavailable: 1

  # -- Node labels the pods must be scheduled on.
  nodeSelector: {}

  # -- Affinity rules, for example to spread pods across nodes.
  affinity: {}

  # -- Topology spread constraints, for example across zones:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  #     labelSelector:
  #       matchLabels: { app.kubernetes.io/name: registry }
  topologySpreadConstraints: []

  # -- Tolerations for node taints.
  tolerations: []

# -- Container security context. The defaults forbid privilege escalation, drop
# all Linux capabilities and make the root filesystem read-only; `/tmp` is a
# writable emptyDir (see `tmpVolume`).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tmpVolume:
  # -- Mount a writable emptyDir at `/tmp`. Needed with a read-only root filesystem.
  enabled: true
  # -- Size limit of the `/tmp` volume.
  sizeLimit: 64Mi

# -- CPU, memory and ephemeral storage of the Registry container. Requests are needed
# for the autoscaler (`hpa`). No CPU limit is set by default, so the Registry is not
# throttled under load. The ephemeral-storage limit covers the container's logs and the
# `/tmp` volume (`tmpVolume.sizeLimit`); a pod that exceeds it is evicted.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 128Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 512Mi

# -- Startup probe: gives the Registry time to start its status server (here up to
# 60 seconds) before the liveness probe applies. `/probe/liveness` answers as soon as
# the status server runs, before the Registry connects to the database; the readiness
# probe checks the database. Requires `config.status.enabled: true`.
startupProbe:
  httpGet:
    path: /probe/liveness
    port: http-status
  periodSeconds: 2
  failureThreshold: 30

# -- Liveness probe: restarts the container when the process no longer responds.
livenessProbe:
  httpGet:
    path: /probe/liveness
    port: http-status
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- Readiness probe: the Registry is ready when its gRPC health service and the
# database respond. Requires `config.grpcServer.flags.health: true`.
readinessProbe:
  httpGet:
    path: /probe/readiness
    port: http-status
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

hpa:
  # -- Create a HorizontalPodAutoscaler. Replaces `replicaCount`. Needs
  # `resources.requests` for the metrics used.
  enabled: false
  # -- Minimum number of pods.
  minReplicas: 1
  # -- Maximum number of pods.
  maxReplicas: 10
  # -- Target average CPU utilization in percent of the request. Null disables the
  # CPU metric.
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization in percent of the request. Null disables
  # the memory metric.
  targetMemoryUtilizationPercentage: 80
  # -- Scaling behavior (stabilization windows and policies) of the autoscaler.
  behavior: {}

###############################################################################
# 3. Networking
###############################################################################

service:
  # -- Additional labels for the Service.
  labels: {}
  # -- Annotations for the Service.
  annotations: {}
  # -- Service type. Keep `ClusterIP`: the gRPC API must not be exposed outside
  # the cluster.
  type: ClusterIP
  # -- Ports of the Service. The first port is the gRPC API and is shown in the
  # release notes. `appProtocol: grpc` lets service meshes handle the traffic as
  # gRPC.
  ports:
    - name: grpc
      protocol: TCP
      port: 9092
      targetPort: grpc
      appProtocol: grpc
    - name: http-status
      protocol: TCP
      port: 8888
      targetPort: http-status

# -- Ports of the Registry container. They must match `config.grpcServer.address`
# and `config.status.address`. The probes and the network policy refer to them by
# name.
ports:
  - name: grpc
    containerPort: 9092
    protocol: TCP
  - name: http-status
    containerPort: 8888
    protocol: TCP

networkPolicy:
  # -- Create a NetworkPolicy for the Registry pods. **Recommended**: the gRPC API
  # can create, block and terminate tenants and has no authentication of its own.
  # When enabled, only the peers listed below can reach the pods; everything else
  # is denied. Outgoing traffic (database, broker, collector) is not restricted.
  enabled: false
  grpc:
    # -- Peers allowed to call the gRPC API (port `grpc`): CMK, the CMK-2-Krypton
    # Bridge and your tenant onboarding tooling. NetworkPolicy peer syntax, for
    # example:
    #   - namespaceSelector:
    #       matchLabels: { kubernetes.io/metadata.name: services }
    #     podSelector:
    #       matchLabels: { app.kubernetes.io/name: cmk }
    # Empty: no peer can reach the gRPC API.
    from: []
  status:
    # -- Peers allowed to reach the status port (`http-status`), for example your
    # metrics collector. Kubelet probes are usually not affected.
    from: []
  # -- Additional ingress rules, in NetworkPolicy syntax.
  extraIngress: []

###############################################################################
# 4. Extension points
###############################################################################

# -- Init containers added to the pod.
extraInitContainers: []

# -- Containers added to the pod, after the Registry container.
extraContainers: []

# -- Volumes added to the pod, for example the Secrets with database credentials
# and broker certificates:
#   - name: db-credentials
#     secret: { secretName: registry-database }
#   - name: broker-certs
#     secret: { secretName: registry-broker-certs }
extraVolumes: []

# -- Volume mounts added to the Registry container. Do not mount anything at
# `/etc/registry/config.yaml`, the configuration file, or over `/etc/registry`.
#   - name: db-credentials
#     mountPath: /etc/credentials/database
#     readOnly: true
#   - name: broker-certs
#     mountPath: /etc/credentials/broker
#     readOnly: true
extraVolumeMounts: []

# -- Environment variables added to the Registry container. Variables without
# prefix that match a configuration key override it, for example `DATABASE_HOST`
# for `config.database.host`. The database driver also reads the standard
# PostgreSQL variables; use them for TLS to the database:
#   - name: PGSSLMODE
#     value: verify-full
#   - name: PGSSLROOTCERT
#     value: /etc/credentials/database/ca.crt
extraEnvs: []

# -- Sources of environment variables (ConfigMaps or Secrets) for the container.
extraEnvsFrom: []

configMap:
  # -- Make the configuration ConfigMap immutable. The chart then adds a hash of
  # the configuration to its name, so a changed configuration creates a new
  # ConfigMap during the upgrade and Helm deletes the previous one. Roll back with
  # `helm rollback`, not `kubectl rollout undo`: the previous pods would mount the
  # deleted ConfigMap and not start. (`config.isImmutable` from older values files is
  # still honoured.)
  immutable: false
  # -- Annotations for the configuration ConfigMap.
  annotations: {}

###############################################################################
# 5. Registry configuration
#
# Everything under `config` is written to /etc/registry/config.yaml (helper registry.config
# in templates/_helpers.tpl). The Registry reads it at startup and rejects unknown keys
# ("has invalid keys"), so only use the keys below. Key names are case-insensitive.
# "Default:" names the Registry's value for a key that is not set in config.yaml.
#
# Value references. Settings marked "value reference" take one of these forms:
#   { source: embedded, value: "…" }      # the value itself. Stored in plain text in the
#                                         # ConfigMap: do not use it for secrets
#   { source: env, env: VARIABLE_NAME }   # an environment variable of the container
#                                         # (extraEnvs, extraEnvsFrom)
#   { source: file, file: { path: /etc/credentials/db/password, format: binary } }
#                                         # the whole file as it is: a trailing newline is part
#                                         # of the value. Mount Secrets with extraVolumes and
#                                         # extraVolumeMounts. format: yaml reads the whole file
#                                         # too
#   { source: file, file: { path: /etc/credentials/db.json, format: json, jsonPath: "$.password" } }
#                                         # one string field of a JSON file
# `source` defaults to `embedded`.
#
# Durations are Go duration strings: `500ms`, `10s`, `5m`, `1h30m`.
#
# Environment variables without prefix override settings that are present in config.yaml:
# the path of the key in upper case, with `_` between the levels, for example
# `DATABASE_HOST` for `database.host` or `ORBITAL_TASKLIMITNUM` for `orbital.taskLimitNum`.
###############################################################################
config:
  # -- Name of the installation, for example `production` or `staging`
  # (`application.environment`). Attached to logs, traces and metrics.
  environment: production

  # -- Additional attributes of the installation (`application.labels`), a map of strings.
  # Attached to logs, traces and metrics. Example: `{ team: key-management }`
  labels: {}

  # The chart writes `environment` and `labels`, together with `name` (the chart name, or
  # `nameOverride`), to the `application` block of config.yaml. To set that block directly,
  # use `application`; its keys take precedence. `name` is the service name in logs, traces
  # and metrics. Example:
  #   application:
  #     name: registry-emea
  #     environment: staging
  #     labels: { team: key-management }

  # PostgreSQL database. The Registry creates and updates its tables at startup.
  database:
    # -- PostgreSQL host name or IP address, a plain string (not a value reference).
    # **Required**, for example `postgresql.services.svc.cluster.local`.
    host: "to be set"
    # -- PostgreSQL port.
    port: 5432
    # -- Database name. Use a database of its own for the Registry. The Registry
    # creates and updates its tables at startup, so its user needs the right to
    # change the schema.
    name: "registry"
    # -- Database user; value reference. **Required.** Prefer a mounted Secret or a
    # variable:
    #   user: { source: file, file: { path: /etc/credentials/database/username, format: binary } }
    #   user: { source: env, env: DB_USER }
    user:
      source: "embedded"
      value: "to be set"
    # -- Database password; value reference. **Required.** Do not embed it in
    # production; the ConfigMap is readable by everyone who can read ConfigMaps in
    # the namespace. Examples:
    #   password:
    #     source: file
    #     file: { path: /etc/credentials/database/password, format: binary }
    #   password: { source: env, env: DB_PASSWORD }
    #   password:
    #     source: file
    #     file: { path: /etc/credentials/database/db.json, format: json, jsonPath: "$.password" }
    # `user` and `password` are written unquoted into the PostgreSQL connection string: they
    # must not contain spaces, quotes or backslashes. A trailing newline is ignored here.
    password:
      source: "embedded"
      value: "to be set"
    # -- SQL logging of the database layer: 1 silent, 2 errors, 3 warnings and errors,
    # 4 every statement (only for troubleshooting). Default: 1.
    logLevel: 1
    # The configuration has no TLS settings. The database driver reads the standard
    # PostgreSQL variables of the container; set them in `extraEnvs`:
    #   PGSSLMODE             disable, allow, prefer (default), require, verify-ca or
    #                         verify-full. Use verify-full in production
    #   PGSSLROOTCERT         CA file that signed the server certificate
    #   PGSSLCERT, PGSSLKEY   client certificate and key files, if the server requires them
    # Host, port, database name, user and password always come from this configuration.

  # gRPC API of the Registry.
  grpcServer:
    # -- Listen address of the gRPC API, `:port` or `host:port`. Must match the `grpc`
    # container port. Default: `:9092`.
    address: :9092
    flags:
      # -- Serve the standard gRPC health service. **Keep true**: the readiness probe uses
      # it. Default: false.
      health: true
      # -- Serve gRPC server reflection, which lets clients list the API without
      # its definitions. Keep false in production. Default: false.
      reflection: false
    attributes:
      # -- Close a connection that has had no running call for this long. Default: 1800s.
      maxConnectionIdle: 300s
      # -- Close connections after this age (±10%), so that clients reconnect and spread
      # over new replicas. Default: 1800s.
      maxConnectionAge: 1800s
      # -- Time that running calls get to finish after `maxConnectionAge`; then the
      # connection is closed. Default: 300s.
      maxConnectionAgeGrace: 5s
      # -- Ping a client after this time without activity. Values below 1s count as 1s.
      # Default: 120m.
      time: 7200s
      # -- Close the connection if a ping is not answered within this time.
      # Default: 20s.
      timeout: 20s
    # -- Minimum interval between keepalive pings of a client; a client that pings more
    # often is disconnected. Default: 180s.
    efPolMinTime: 300s
    # -- Allow client keepalive pings when no call is running. Default: false.
    efPolPermitWithoutStream: false
    # -- Largest accepted request in bytes. Default: 125829120 (120 MiB). The
    # Registry's requests are small; 4 MiB is plenty.
    maxRecvMsgSize: 4194304
    client:
      # Internal client of the readiness check. It calls the gRPC health service at
      # `grpcServer.address`, without TLS.
      attributes:
        # -- Interval of the health check client's keepalive pings. gRPC raises values
        # below 10s to 10s. Default: 80s.
        keepaliveTime: 1s
        # -- Time the health check client waits for a ping answer. Default: 40s.
        keepaliveTimeout: 1s
      # Connections of the health check client. Example with the defaults:
      #   pool:
      #     initialCapacity: 1      # connections opened at the first check, at least 1
      #     maxCapacity: 1          # most connections, at least initialCapacity
      #     idleTimeout: 5s         # replace a connection unused for this long
      #     maxLifeDuration: 60s    # replace a connection older than this

  # Orbital delivers the jobs of a tenant (changes of the tenant, its authentication and its
  # configuration) to the CMK of the tenant's region: it confirms a new job, creates its task
  # and sends the task over AMQP until the CMK answers.
  orbital:
    # -- Minimum age of a new job before it is confirmed and sent. A short delay gives
    # the request that created the job time to finish. Duration, at least 0.
    # Default: 0s.
    confirmJobAfter: 2s
    # -- **Required**, greater than 0. Most tasks of one job that a reconcile run sends.
    taskLimitNum: 10
    # -- **Required**, greater than 0. Number of sends of a task without an answer after
    # which the task fails. Every answer resets the count.
    maxPendingReconciles: 10
    # -- **Required**, greater than 0. Base of the resend interval, in seconds: after the
    # n-th send without an answer, the next send waits `backoffBaseIntervalSec` × 2^n
    # seconds, at most `backoffMaxIntervalSec`. With 2: 4s, 8s, 16s, …
    backoffBaseIntervalSec: 2
    # -- **Required**, greater than 0. Longest resend interval in seconds.
    backoffMaxIntervalSec: 240

    # -- Brokers to send tenant jobs to: one target per region that has a CMK. A tenant's
    # jobs go to the target whose `region` equals the tenant's region; without a matching
    # target the job is canceled. **Required** for a working deployment. The Registry
    # connects to every target at startup and does not start if one cannot be reached.
    #   region                region name as used in RegisterTenant. **Required**
    #   connection.type       `amqp` (AMQP 1.0), the only type. **Required**
    #   connection.amqp       all three **required**:
    #     url                 amqps://host:port (TLS; default port 5671; amqp+ssl:// is the
    #                         same) or amqp://host:port (no TLS; default port 5672)
    #     target              address the Registry sends jobs to. Must equal the `source` of
    #                         the CMK tenant manager of this region (tenantManager.amqp.source)
    #     source              address the Registry reads the answers from. Must equal the
    #                         `target` of that CMK tenant manager
    #   connection.auth.type  `mtls` or `none`. **Required**; use mtls in production:
    #     mtls                client certificate (SASL EXTERNAL). Needs an amqps:// URL; the
    #                         broker certificate must be valid for the host name in `url`.
    #                         All three PEM files are required and are read at startup:
    #                         restart the pods after renewing the certificate
    #       certFile          client certificate
    #       keyFile           its private key
    #       caFile            CA that signed the broker certificate
    #     none                no credentials (SASL ANONYMOUS), for development brokers
    # Example with mTLS:
    #   targets:
    #     - region: emea
    #       connection:
    #         type: amqp
    #         amqp:
    #           url: amqps://rabbitmq.services.svc.cluster.local:5671
    #           target: /queues/cmk.emea.tenants
    #           source: /queues/cmk.global.tenants
    #         auth:
    #           type: mtls
    #           mtls:
    #             certFile: /etc/credentials/broker/tls.crt
    #             keyFile: /etc/credentials/broker/tls.key
    #             caFile: /etc/credentials/broker/ca.crt
    # Example of a development broker without authentication:
    #   targets:
    #     - region: emea
    #       connection:
    #         type: amqp
    #         amqp:
    #           url: amqp://rabbitmq.dev.svc.cluster.local:5672
    #           target: /queues/cmk.emea.tenants
    #           source: /queues/cmk.global.tenants
    #         auth:
    #           type: none
    targets: []

    # -- Tuning of Orbital's background workers in each pod. Workers that are not listed
    # keep Orbital's defaults: 5 workers, `execInterval` 10s (reconcile: 5s), `timeout` 5s.
    # A listed worker needs all three values, each greater than 0.
    #   name          `confirm-job` (confirms new jobs), `create-task` (creates the tasks of
    #                 a job), `reconcile` (sends tasks and processes answers) or
    #                 `notify-event` (reports finished jobs)
    #   noOfWorkers   workers of this kind that run in parallel
    #   execInterval  interval between the runs of a worker, duration
    #   timeout       longest duration of one run, duration
    workers:
      - name: confirm-job
        noOfWorkers: 1
        execInterval: 1s
        timeout: 5s
      - name: create-task
        noOfWorkers: 1
        execInterval: 1s
        timeout: 5s
      - name: reconcile
        noOfWorkers: 1
        execInterval: 1s
        timeout: 5s
      - name: notify-event
        noOfWorkers: 1
        execInterval: 1s
        timeout: 5s

  # -- Rules that restrict the values callers may register, in addition to the Registry's
  # built-in checks (for example, IDs, names and regions must not be empty). Each entry:
  #   id               the field, see the field IDs below
  #   constraints      one or more constraints; a value must pass all of them
  #   skipIfNotExists  true: ignore the entry if `id` is not a field of this Registry
  #                    version. Default: false, an unknown `id` stops the Registry at startup
  # Constraint types (`type`) and their `spec`:
  #   list            spec.allowList: [values]   the value is one of the values
  #   regex           spec.pattern: "RE2"        the value matches the Go (RE2) regular
  #                                              expression; for a list field, every
  #                                              element does. Use ^…$ for the whole value
  #   non-empty       no spec                    the value is not empty
  #   non-empty-keys  no spec                    the map has no empty key
  #   non-empty-vals  no spec                    the map has no empty value
  #   map-keys        spec.keys: [{ name, required, constraints }]
  #                                              rules per map key: `required: true` rejects
  #                                              a map without the key; `constraints` (list,
  #                                              regex, non-empty) check the key's value
  # Field IDs, with the constraint types that fit them:
  #   text (list, regex, non-empty): Tenant.ID, Tenant.Name, Tenant.Region, Tenant.OwnerID,
  #     Tenant.OwnerType, Tenant.Role, System.ExternalID, System.Type, RegionalSystem.Region,
  #     RegionalSystem.Status, RegionalSystem.L2KeyID, Auth.ExternalID, Auth.TenantID,
  #     Auth.Type, Auth.Status, TenantConfig.TenantID
  #   list of text (regex): Tenant.UserGroups
  #   map of text (non-empty-keys, non-empty-vals, map-keys): Tenant.Labels,
  #     RegionalSystem.Labels, Auth.Properties
  # Any other combination rejects every value of the field ("value has wrong type").
  # Several entries for the same `id` add up. Rules apply to every later change of an
  # object, so tightening a rule can block changes to objects registered before.
  # The defaults below fit a deployment with CMK. A `validations` list in your values
  # replaces them (Helm replaces lists), so repeat the default rules you keep. Add your
  # regions and tenant owner types. Example with every constraint type, to add to the
  # default rules:
  #   - id: Tenant.Region
  #     constraints: [{ type: list, spec: { allowList: ["emea", "us"] } }]
  #   - id: RegionalSystem.Region
  #     constraints: [{ type: list, spec: { allowList: ["eu10", "us10"] } }]
  #   - id: Tenant.OwnerType
  #     constraints: [{ type: list, spec: { allowList: ["customer"] } }]
  #   - id: Tenant.ID
  #     constraints: [{ type: regex, spec: { pattern: "^[a-z0-9-]{1,64}$" } }]
  #   - id: Tenant.Labels
  #     constraints: [{ type: non-empty-keys }, { type: non-empty-vals }]
  #   - id: RegionalSystem.Labels
  #     constraints:
  #       - type: map-keys
  #         spec:
  #           keys:
  #             - name: cost-center
  #               required: true
  #               constraints: [{ type: regex, spec: { pattern: "^[0-9]{4}$" } }]
  #             - name: tier                  # optional key, checked when present
  #               constraints: [{ type: list, spec: { allowList: ["gold", "silver"] } }]
  #   - id: Tenant.Contact                    # not a field of this Registry version
  #     skipIfNotExists: true
  #     constraints: [{ type: non-empty }]
  validations:
    # CMK applies OpenID Connect settings only.
    - id: Auth.Type
      constraints:
        - type: list
          spec:
            allowList: ["oidc"]
    # Every identity provider needs an issuer.
    - id: Auth.Properties
      constraints:
        - type: map-keys
          spec:
            keys:
              - name: issuer
                required: true
                constraints:
                  - type: non-empty
    # The groups that CMK creates for each tenant.
    - id: Tenant.UserGroups
      constraints:
        - type: regex
          spec:
            pattern: "^KMS_(TenantAdministrator|TenantAuditor)_[A-Za-z0-9-]+$"
    # CMK accepts only these system types.
    - id: System.Type
      constraints:
        - type: list
          spec:
            allowList: ["system", "subaccount"]

  # Status server for the probes, version and metrics.
  status:
    # -- Serve the status endpoints (`/probe/liveness`, `/probe/readiness`, `/version`
    # and, if enabled, `/metrics` and `/debug/pprof/`). Needed by the probes.
    # Default: false.
    enabled: true
    # -- Listen address of the status server. Must match the `http-status`
    # container port. Default: `:8888`.
    address: :8888
    # -- Serve Go profiling endpoints (`/debug/pprof/`) on the status port, without
    # authentication. Keep false in production; enable it only for troubleshooting.
    profiling: false

  # Logs of the Registry on standard output.
  logger:
    # -- Log level: `trace`, `debug`, `info`, `warn` or `error`; other values mean `info`.
    # `debug` and `trace` log request details; use them only for troubleshooting.
    level: info
    # -- Log format: `json` or `text`. Default: `json`.
    format: json
    # -- Add the source file and line to each log record. Default: false.
    source: false
    formatter:
      time:
        # -- Time format: `pattern` (text, see `pattern`) or `unix` (a number, see
        # `precision`). Default: `unix`.
        type: pattern
        # -- Go time layout, used with `type: pattern`. Times are written in UTC.
        # Default: `Mon Jan 02 15:04:05 -0700 2006`.
        pattern: "Mon Jan 02 15:04:05 -0700 2006"
        # -- Unit of the Unix time, used with `type: unix`: `1ns`, `1us`, `1ms` or `1s`.
        # Default: `1us`. Example of Unix time in milliseconds:
        #   time: { type: unix, precision: 1ms }
        precision: 1s
      # Field names and masking of log records. Keys not set here keep the Registry's
      # defaults: `time: time`, `error: error`, `message: msg`,
      # `otel: { traceId: traceId, spanId: spanId }` and no masking. Example:
      #   fields:
      #     time: ts
      #     error: err
      #     level: level
      #     message: message
      #     otel: { traceId: trace_id, spanId: span_id }
      #     masking:
      #       pii: [email, ip-address]     # string values keep their first 4 characters
      #       other: { jwt-token: "*****" } # replace the whole value
      fields:
        # -- Name of the log level field. The Registry's own default is `info`, which
        # writes `"info":"INFO"`; the chart uses `level`.
        level: level

  # OpenTelemetry export (OTLP) of logs, traces and metrics. Each signal has:
  #   enabled    export this signal. Default: false
  #   protocol   `grpc` or `http`
  #   host       collector endpoint as host:port, without scheme or path; value reference,
  #              e.g. otel-collector:4317 (grpc) or otel-collector:4318 (http)
  #   url        URL path, used with `http`. Empty: /v1/traces and /v1/metrics; logs have no
  #              default, set `url: /v1/logs`
  #   secretRef  connection security, **required** for an enabled signal. With `grpc`:
  #              insecure, api-token, basic or mtls. With `http`: insecure, api-token or
  #              mtls. Use mtls or api-token in production:
  #                { type: insecure }               # no TLS
  #                { type: api-token, apiToken: <value reference> }
  #                                                 # TLS; header Authorization: Api-Token …
  #                type: basic                      # grpc only. TLS; Authorization: Basic …
  #                basic:
  #                  username: <value reference>
  #                  password: <value reference>
  #                type: mtls                       # TLS with a client certificate
  #                mtls:
  #                  cert: <value reference>        # client certificate (PEM)
  #                  certKey: <value reference>     # its private key (PEM)
  #                  serverCa: <value reference>    # CA that signed the collector
  #                                                 # certificate. Optional
  #                  rootCAs: [<value reference>]   # additional trusted CAs. Optional
  #                  attributes:
  #                    serverName: …                # expected server name, if it differs
  #                                                 # from `host`. Optional
  #              api-token and basic, and mtls without serverCa and rootCAs, trust the CA
  #              certificates of the container image.
  # An enabled signal needs `protocol`, `host` and `secretRef`; metrics for Prometheus need
  # none of them.
  # `dynatraceOneAgent: true` adds the metadata of a Dynatrace OneAgent on the node to the
  # exported data. Default: false.
  # Example: traces over gRPC with mTLS, metrics and logs over HTTP:
  #   telemetry:
  #     traces:
  #       enabled: true
  #       protocol: grpc
  #       host: { source: embedded, value: otel-collector.observability:4317 }
  #       secretRef:
  #         type: mtls
  #         mtls:
  #           cert: { source: file, file: { path: /etc/otel/tls.crt, format: binary } }
  #           certKey: { source: file, file: { path: /etc/otel/tls.key, format: binary } }
  #           serverCa: { source: file, file: { path: /etc/otel/ca.crt, format: binary } }
  #     metrics:
  #       enabled: true
  #       protocol: http
  #       host: { source: env, env: OTEL_HOST }
  #       url: /v1/metrics
  #       secretRef:
  #         type: api-token
  #         apiToken: { source: file, file: { path: /etc/otel/api-token, format: binary } }
  #     logs:
  #       enabled: true
  #       protocol: http
  #       host: { source: env, env: OTEL_HOST }
  #       url: /v1/logs
  #       secretRef: { type: insecure }
  # Example: basic authentication and an API token over gRPC, metrics for Prometheus:
  #   telemetry:
  #     dynatraceOneAgent: true
  #     traces:
  #       enabled: true
  #       protocol: grpc
  #       host: { source: env, env: OTEL_HOST }
  #       secretRef:
  #         type: basic
  #         basic:
  #           username: { source: env, env: OTEL_USERNAME }
  #           password: { source: file, file: { path: /etc/otel/password, format: binary } }
  #     logs:
  #       enabled: true
  #       protocol: grpc
  #       host: { source: env, env: OTEL_HOST }
  #       secretRef:
  #         type: api-token
  #         apiToken: { source: env, env: OTEL_API_TOKEN }
  #     metrics:
  #       enabled: true
  #       prometheus: { enabled: true }
  # Example: mTLS over HTTP with additional CAs and another server name:
  #   telemetry:
  #     traces:
  #       enabled: true
  #       protocol: http
  #       host: { source: embedded, value: otel-collector.observability:4318 }
  #       secretRef:
  #         type: mtls
  #         mtls:
  #           cert: { source: file, file: { path: /etc/otel/tls.crt, format: binary } }
  #           certKey: { source: file, file: { path: /etc/otel/tls.key, format: binary } }
  #           rootCAs:
  #             - { source: file, file: { path: /etc/otel/root-ca.crt, format: binary } }
  #           attributes: { serverName: otel-collector.example.com }
  telemetry:
    logs:
      # -- Export logs over OTLP.
      enabled: false
      # -- OTLP protocol: `grpc` or `http`.
      protocol: http
      # -- Collector endpoint; value reference. Read here from the variable
      # `OTEL_HOST`, which you can set in `extraEnvs`.
      host:
        source: env
        env: OTEL_HOST
      # -- Connection security; see above.
      secretRef:
        type: insecure
    traces:
      # -- Export traces over OTLP.
      enabled: false
      # -- OTLP protocol: `grpc` or `http`.
      protocol: http
      # -- Collector endpoint; value reference.
      host:
        source: env
        env: OTEL_HOST
      # -- Connection security; see above.
      secretRef:
        type: insecure
    metrics:
      # -- Export metrics: over OTLP, or for Prometheus (see `prometheus`).
      enabled: false
      # -- OTLP protocol: `grpc` or `http`.
      protocol: http
      # -- Collector endpoint; value reference.
      host:
        source: env
        env: OTEL_HOST
      # -- Connection security; see above.
      secretRef:
        type: insecure
      prometheus:
        # -- Serve the metrics for Prometheus on the status port at `/metrics` instead of
        # sending them over OTLP. Needs `metrics.enabled: true`.
        enabled: false
