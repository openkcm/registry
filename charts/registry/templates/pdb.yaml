{{- if .Values.pod.disruptionBudget.enabled }}
{{- $pdb := .Values.pod.disruptionBudget }}
{{- if and (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable") }}
{{- fail "pod.disruptionBudget: set either minAvailable or maxUnavailable, not both" }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "registry.fullname" . }}
  namespace: {{ include "registry.namespace" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "registry.selectorLabels" . | nindent 6 }}
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  # Neither minAvailable nor maxUnavailable is set. maxUnavailable: 1 never blocks
  # node drains, even with a single replica.
  maxUnavailable: 1
  {{- end }}
{{- end }}
